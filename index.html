<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Fedrika — Estética & Saúde</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-layout">

  <!-- ======== SIDEBAR ======== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <img src="img/logo.png" alt="Fedrika" class="sidebar-logo">
      </div>
      <button class="sidebar-toggle-btn" onclick="App.toggleSidebar()" title="Recolher menu">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Geral</div>
      <a class="nav-link active" data-page="dashboard" href="#">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" data-page="agenda" href="#">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Agenda</span>
      </a>

      <div class="nav-section-label">Clientes</div>
      <a class="nav-link" data-page="clientes" href="#">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Clientes</span>
      </a>
      <a class="nav-link" data-page="anamnese" href="#">
        <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2M9 12h6M9 16h4"/></svg>
        <span>Anamnese</span>
      </a>
      <a class="nav-link" data-page="atividades" href="#">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Atividades</span>
      </a>

      <div class="nav-section-label">Operacional</div>
      <a class="nav-link" data-page="servicos" href="#">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span>Serviços</span>
      </a>
      <a class="nav-link" data-page="estoque" href="#">
        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span>Estoque</span>
      </a>

      <div class="nav-section-label">Financeiro</div>
      <a class="nav-link" data-page="financeiro" href="#">
        <svg viewBox="0 0 24 24"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        <span>Financeiro</span>
      </a>
      <a class="nav-link" data-page="metas" href="#">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span>Metas & KPIs</span>
      </a>
      <a class="nav-link" data-page="relatorios" href="#">
        <svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        <span>Relatórios</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="nav-link" data-page="config" href="#">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M1 12h2M21 12h2M12 1v2M12 21v2"/></svg>
        <span>Configurações</span>
      </a>
      <div class="user-card">
        <div class="user-avatar-sm" id="sidebarAvatar">A</div>
        <div class="user-meta">
          <div class="user-name-sm" id="sidebarName">Admin</div>
          <div class="user-role-sm" id="sidebarRole">Administrador</div>
        </div>
      </div>
      <button class="user-logout" onclick="Auth.logout()" title="Sair">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span class="sidebar-text">Sair</span>
      </button>
    </div>
  </aside>

  <!-- ======== MAIN ======== -->
  <div class="main">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-icon btn-menu" onclick="App.openMobileSidebar()" title="Abrir menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="topbarTitle">Dashboard</h1>
        <p id="topbarSub">Visão geral do negócio</p>
      </div>
      <div class="topbar-right">
        <span class="topbar-date" id="topbarDate"></span>
        <button class="btn-icon" title="Novo agendamento" onclick="App.navigateTo('agenda')">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="15" x2="12" y2="19"/><line x1="10" y1="17" x2="14" y2="17"/></svg>
        </button>
        <button class="btn-icon" title="Novo cliente" onclick="App.navigateTo('clientes')">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        </button>
      </div>
    </div>

    <!-- Pages -->
    <div class="page-content">

      <div class="page active" id="page_dashboard">
        <div id="dashContent"></div>
      </div>

      <div class="page" id="page_agenda">
        <div id="agendaContent"></div>
      </div>

      <div class="page" id="page_clientes">
        <div id="clientesContent"></div>
      </div>

      <div class="page" id="page_anamnese">
        <div id="anamneseContent"></div>
      </div>

      <div class="page" id="page_servicos">
        <div id="servicosContent"></div>
      </div>

      <div class="page" id="page_financeiro">
        <div id="financeiroContent"></div>
      </div>

      <div class="page" id="page_estoque">
        <div id="estoqueContent"></div>
      </div>

      <div class="page" id="page_metas">
        <div id="metasContent"></div>
      </div>

      <div class="page" id="page_atividades">
        <div id="atividadesContent"></div>
      </div>

      <div class="page" id="page_relatorios">
        <div id="relatoriosContent"></div>
      </div>

      <div class="page" id="page_config">
        <div id="configContent"></div>
      </div>

    </div><!-- /page-content -->
  </div><!-- /main -->

</div><!-- /app-layout -->

<div id="sidebarBackdrop" class="sidebar-backdrop" onclick="App.closeMobileSidebar()"></div>

<!-- Login overlay -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <div class="login-brand">
      <img src="img/logo.png" alt="Fedrika" class="login-logo">
    </div>
    <div id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')Auth.login()"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')Auth.login()"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="Auth.login()">Entrar</button>
      <div style="text-align:center;margin-top:14px;font-size:13px">
        <span style="color:var(--text-muted)">Não tem conta? </span>
        <a href="#" onclick="Auth.showSignup();return false" style="color:var(--primary);font-weight:600">Criar conta</a>
      </div>
    </div>
    <div id="signupForm" class="hidden">
      <div class="form-group"><label>Email</label><input type="email" id="signupEmail" placeholder="seu@email.com"></div>
      <div class="form-group"><label>Senha</label><input type="password" id="signupPassword" placeholder="Mínimo 6 caracteres"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="Auth.signup()">Criar conta</button>
      <div style="text-align:center;margin-top:14px;font-size:13px">
        <a href="#" onclick="Auth.showLogin();return false" style="color:var(--primary)">← Voltar para login</a>
      </div>
    </div>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toastContainer" class="toast-container"></div>

<!-- Scripts com cache-busting automático -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const _v = '20260515e';
  const _scripts = ['js/db.js','js/utils.js','js/modules/dashboard.js','js/modules/agenda.js',
    'js/modules/clientes.js','js/modules/anamnese.js','js/modules/servicos.js',
    'js/modules/financeiro.js','js/modules/estoque.js','js/modules/metas.js',
    'js/modules/atividades.js','js/modules/relatorios.js','js/modules/config.js','js/app.js'];
  (function loadNext(i) {
    if(i >= _scripts.length) { App.init(); return; }
    const s = document.createElement('script');
    s.src = _scripts[i] + '?v=' + _v;
    s.onload = () => loadNext(i + 1);
    document.head.appendChild(s);
  })(0);
</script>
</body>
</html>
